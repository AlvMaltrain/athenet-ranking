# Compose de produccion (EC2). En el servidor se copia como "docker-compose.yml".
# Sin RabbitMQ ni Postgres locales: la app usa el broker compartido (RABBITMQ_*)
# y la base en RDS (DB_URL).
services:
  app:
    image: ${IMAGE:-ghcr.io/alvmaltrain/athenet-ranking:latest}
    container_name: athenet-ranking-app
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:?definir DB_URL en .env}
      DB_USERNAME: ${DB_USERNAME:?definir DB_USERNAME en .env}
      DB_PASSWORD: ${DB_PASSWORD:?definir DB_PASSWORD en .env}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?definir RABBITMQ_HOST en .env}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:?definir RABBITMQ_USER en .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?definir RABBITMQ_PASSWORD en .env}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_SSL: ${RABBITMQ_SSL:-false}
      RANKING_DLX_ROUTING_KEY: ${RANKING_DLX_ROUTING_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?definir CORS_ALLOWED_ORIGINS en .env}
      LOG_LEVEL_RANKING: ${LOG_LEVEL_RANKING:-INFO}
    ports:
      - "8083:8083"
