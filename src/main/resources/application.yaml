server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: ranking

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ranking_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # El esquema lo gestiona Flyway (db/migration); Hibernate solo valida que
      # las entidades coincidan con las tablas, nunca las modifica.
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD}
    ssl:
      enabled: ${RABBITMQ_SSL:false}

athenet:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  messaging:
    resultado-registrado:
      # "athenet.topic" es el exchange compartido por todos los microservicios de Athenet
      # (lo publica MS-Competencia). routing-key confirmado contra su codigo.
      exchange: ${RESULTADO_REGISTRADO_EXCHANGE:athenet.topic}
      routing-key: ${RESULTADO_REGISTRADO_ROUTING_KEY:resultado.registrado}
      queue: ${RESULTADO_REGISTRADO_QUEUE:ranking.resultado.registrado.queue}
      # "athenet.dlx" tambien es compartido (cada microservicio cuelga su propia DLQ ahi),
      # igual que en Competencia.
      dead-letter-exchange: ${DEAD_LETTER_EXCHANGE:athenet.dlx}
      dlq: ${RESULTADO_REGISTRADO_DLQ:ranking.resultado.registrado.queue.dlq}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  level:
    com.athenet.ranking: ${LOG_LEVEL_RANKING:INFO}
