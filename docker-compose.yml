services:
  db:
    image: postgres:16-alpine
    container_name: athenet-ranking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ranking_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ranking_db_data:/var/lib/postgresql/data
    ports:
      # 5433 en el host para no chocar con un Postgres nativo u otro
      # microservicio que ya use el 5432 por defecto.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: athenet-ranking-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # UI de administracion: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # "image" es lo que se usa con `docker compose pull` (ej. en un servidor,
    # con la imagen publicada por un pipeline de CI/CD). "build" es lo que se
    # usa en local con `docker compose up --build`.
    image: ${IMAGE:-ghcr.io/alvmaltrain/api-athenet-ranking:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: athenet-ranking-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-ranking_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RANKING_DLX_ROUTING_KEY: ${RANKING_DLX_ROUTING_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4200}
      LOG_LEVEL_RANKING: ${LOG_LEVEL_RANKING:-INFO}
    ports:
      - "8083:8083"

volumes:
  ranking_db_data:
